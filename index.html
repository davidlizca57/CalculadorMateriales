<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Calculador de materiales</title>
    <meta name="description" content="Iniciar sesion">
    <meta name="keywords" content="FET, Interfaces, proyecto">
    <meta name="author" content="David Lizcano">
    <link rel="shortcut icon" href="img/icon.png">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--Inicio de sesion-->
    <main class="Contenido_Principal">
        <section class="Login">
            <form action="menu.html">
                <h1>Iniciar sesion</h1>
                <p style="color: gray;">Ingrese sus datos para proceder.</p>

                <label for="usuario">Ingrese su usuario o correo:</label>
                <input type="text" id="usuario" placeholder="usuario o email" required>

                <label for="contraseña">Ingrese su contraseña:</label>
            <div class="grupo-password">
                <input type="password" id="password" placeholder="contraseña" required>
                <span class="eye" id="eye">&#x1F441</span>
            </div>

                <p>¿No tiene cuenta?<a href="registro.html"> Registrese</a></p>
                <p>¿Se le olvido la contraseña?<a href="recuperacion.html"> Recuperar </a></p>

                <button type="submit">Ingresar</button>
            </form>
        </section>

        <!--Bienvenida-->
        <section class="bienvenida">
            <div class="titulo_bienvenida">
                <p>Bienvenido al calculador de materiales</p>
            </div>
            <div class="icon-imagen">
                <img src="img/icon.png" alt="Icono de ladrillo bienvenida">
            </div>
        </section>
    </main>
</body>

</html>
