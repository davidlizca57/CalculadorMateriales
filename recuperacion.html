<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registrarse</title>
    <meta name="description" content="Recuperacion">
    <meta name="keywords" content="FET, Interfaces, proyecto">
    <meta name="author" content="David Lizcano">
    <link rel="shortcut icon" href="img/iconForget.png">
    <link rel="stylesheet" href="css/style_recuperacion.css">

</head>

<body>
    <header class="icon-imagen">
        <img src="img/iconForget.png" alt="ImagenRecuperacion">
    </header>

    <main class="Contenido-recuperacion">
        <section class="Recovery">
            <form>
                <h1>Recuperacion de contraseña</h1>
                <p style="color: rgb(61, 61, 61);">Ingrese el correo con el que se registro y le enviaremos un mensaje para restaurar la contraseña</p>

                <label for="email">Correo: </label>
                <input type="email" id="email" placeholder="Correo de recuperacion" required>
                
                <p>¿Ya recordo su contraseña? <a href="index.html">Iniciar sesion</a></p>

                <button type="submit">Enviar enlace de recuperacion</button>
            </form>
        </section>
    </main>
</body>
