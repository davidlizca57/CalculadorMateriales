<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Muro de ladrillo</title>
    <meta name="author" content="David Lizcano">
    <link rel="shortcut icon" href="img/icon.png">
    <link rel="stylesheet" href="css/style_CalMuro.css">
</head>
<body>

    <!-- BARRA SUPERIOR EN TONO NARANJA -->
    <header class="barra-naranja">
        <a href="menu.html" class="btn-atras">&#x2190;</a>
        <img src="img/icon.png" alt="Icono muro" class="icono-encabezado">
        <h1>Muro de ladrillo</h1>
    </header>

    <!-- PANEL PRINCIPAL DE TRABAJO -->
    <main class="contenedor-calculo">
        
        <!-- SECCION IZQUIERDA: FORMULARIO DE ENTRADA -->
        <section class="bloque-datos">
            <h2>Datos del muro</h2>
            <form id="formulario-muro">
                
                <p class="etiqueta">Espesor del muro</p>
                <div class="grupo-radio">
                    <label>
                        <input type="radio" name="espesor" value="20" checked> 20 cm
                    </label>
                    <label>
                        <input type="radio" name="espesor" value="30"> 30 cm
                    </label>
                </div>

                <label class="etiqueta" for="largo">Largo del muro (m)</label>
                <input type="number" id="largo" step="0.01" placeholder="0.0" required>

                <label class="etiqueta" for="alto">Alto del muro (m)</label>
                <input type="number" id="alto" step="0.01" placeholder="0.0" required>

                <input type="submit" value="Calcular materiales" class="btn-calcular">
            </form>
        </section>

        <section class="bloque-resultados">
            <h2>Resultados</h2>
            <div class="tarjeta-gris-resultados">
                <p class="titulo-naranja-tabla">Materiales necesarios</p>
                
                <div class="fila-resultado">
                    <span>Superficie del muro</span>
                    <strong id="res-superficie">0,00 m²</strong>
                </div>
                <div class="fila-resultado">
                    <span>Cemento</span>
                    <strong id="res-cemento">0,0 kg</strong>
                </div>
                <div class="fila-resultado">
                    <span>Arena</span>
                    <strong id="res-arena">0,00 m³</strong>
                </div>
                <div class="fila-resultado">
                    <span>Ladrillos</span>
                    <strong id="res-ladrillos">0 unidades</strong>
                </div>
            </div>
        </section>

    </main>

    <script src="scrips/Script_CalMuro.js"></script>
</body>
</html>
