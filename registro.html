<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registrarse</title>
    <meta name="description" content="Registrarse">
    <meta name="keywords" content="FET, Interfaces, proyecto">
    <meta name="author" content="David Lizcano">
    <link rel="shortcut icon" href="img/iconRegister.png">
    <link rel="stylesheet" href="css/style_registro.css">

</head>

<body>
    <main class="Contenido-registro">
        <section class="Register">
            <form action="index.html">
                <h1>Registrarse</h1>
                <p>Ingrese sus datos para poder registrarlo.</p>

                <label for="nuevo_usuario">Nombre de usuario:</label>
                <input type="text" id="nuevo_usuario" placeholder="Primer nombre de usuario" required>

                <label for="email">Correo al cual vincuar al usuario:</label>
                <input type="email" id="email" placeholder="Correo">

                <label for="password">Ingrese una contraseña:</label>
                <input type="password" id="password" placeholder="Contraseña">

                <label for="confirm-password">Confirme su contraseña:</label>
                <input type="password" id="confirm-password" placeholder="Repetir contraseña">

                <p>¿Ya tiene cuenta? <a href="index.html">Iniciar sesion</a></p>

                <button type="submit">Registrarse</button>
            </form>
        </section>
    </main>
</body>
